# Optional original VideoQ frontend on the same HTTPS origin as its API.
# Build /tmp/videoq-lti-lab/web-dist first; combine with all three live sync files.
services:
  web:
    image: caddy:2-alpine
    volumes:
      - ${LTI_LAB_DIR:?Set LTI_LAB_DIR}/web-dist:/srv:ro
      - ./Caddyfile.web-static:/etc/caddy/Caddyfile:ro
  proxy:
    volumes:
      - ./Caddyfile.web:/etc/caddy/Caddyfile:ro
