<VirtualHost *:80>
    # PHP and Moodle enforce the file limit; do not impose Apache's smaller body cap.
    LimitRequestBody 0
    # Caddy handles client connections and authenticated file delivery.
    KeepAlive Off
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        FallbackResource /r.php
    </Directory>
</VirtualHost>
