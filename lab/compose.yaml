# Isolated, loopback-only interoperability lab. Never use these credentials in production.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: lti-lab-only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      retries: 30
  moodle:
    image: moodlehq/moodle-php-apache:8.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${MOODLE_SOURCE:?Set MOODLE_SOURCE}:/var/www/html
      - ./moodle-config.php:/var/www/html/config.php:ro
      - ./apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - .:/lab:ro
      - ${MOODLE_INTEGRATION_ROOT:-..}/plugins/local/videoq:/var/www/html/public/local/videoq:ro
      - ${MOODLE_INTEGRATION_ROOT:-..}/plugins/ltisource/videoq:/var/www/html/public/mod/lti/source/videoq:ro
      - ${LTI_LAB_DIR:?Set LTI_LAB_DIR}/lesson.mp4:/lab-data/lesson.mp4:ro
      - moodledata:/var/www/moodledata
  proxy:
    image: caddy:2-alpine
    ports:
      - 127.0.0.1:18443:18443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    networks:
      default:
        aliases: [moodle.localhost, videoq.localhost]
  api:
    image: node:22-bookworm-slim
    working_dir: /workspace/apps/api
    command: [node, /fixtures/start-api.mjs]
    depends_on:
      db:
        condition: service_healthy
    env_file: ./api.env
    environment:
      NODE_EXTRA_CA_CERTS: /certificates/caddy/pki/authorities/local/root.crt
    volumes:
      - ${VIDEOQ_ROOT:?Set VIDEOQ_ROOT}:/workspace:ro
      - certificates:/certificates:ro
      - ${LTI_LAB_DIR:?Set LTI_LAB_DIR}:/lab
      - .:/fixtures:ro
  ai:
    image: node:22-bookworm-slim
    command: [node, /lab/mock-ai.mjs]
    volumes:
      - ./mock-ai.mjs:/lab/mock-ai.mjs:ro
      - ./lesson-scenes.mjs:/lab/lesson-scenes.mjs:ro
volumes:
  pgdata:
  moodledata:
  certificates:
