# Isolated, loopback-only interoperability lab. Never use these credentials in production.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: lti-lab-only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      retries: 30
  moodle:
    image: moodlehq/moodle-php-apache@sha256:1db7b6ed013fcb5268095b5e28c410ba9117d38d9b6a324c100c48fcbe69745e
    entrypoint: [sh, /lab/start-moodle.sh]
    command: [apache2-foreground]
    environment:
      MOODLE_MEDIA_OFFLOAD: ${MOODLE_MEDIA_OFFLOAD:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${MOODLE_SOURCE:?Set MOODLE_SOURCE}:/var/www/html
      - ./moodle-config.php:/var/www/html/config.php:ro
      - ./apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./mpm-prefork.conf:/etc/apache2/mods-enabled/mpm_prefork.conf:ro
      - .:/lab:ro
      - ${MOODLE_INTEGRATION_ROOT:-..}/plugins/local/videoq:/var/www/html/public/local/videoq:ro
      - ${MOODLE_INTEGRATION_ROOT:-..}/plugins/ltisource/videoq:/var/www/html/public/mod/lti/source/videoq:ro
      - ${LTI_LAB_DIR:?Set LTI_LAB_DIR}/lesson.mp4:/lab-data/lesson.mp4:ro
      - moodledata:/var/www/moodledata
      - certificates:/certificates:ro
      - ./php-sync.ini:/usr/local/etc/php/conf.d/99-videoq-sync-lab.ini:ro
  proxy:
    image: caddy:2-alpine
    ports:
      - 127.0.0.1:18443:18443
    environment:
      VIDEOQ_API_UPSTREAM: ${VIDEOQ_API_UPSTREAM:-api:8787}
      VIDEOQ_WEB_UPSTREAM: ${VIDEOQ_WEB_UPSTREAM:-web:80}
      VIDEOQ_STORAGE_UPSTREAM: ${VIDEOQ_STORAGE_UPSTREAM:-garage:3900}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - moodledata:/moodledata:ro
    networks:
      default:
        aliases: [moodle.localhost, videoq.localhost, storage.videoq.localhost]
  videoq-sync:
    extends:
      service: moodle
    volumes:
      - certificates:/certificates:ro
    entrypoint: [sh, /lab/run-sync.sh]
    command: []
    restart: unless-stopped
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/tmp/videoq-sync-ready') && time() - (int)file_get_contents('/tmp/videoq-sync-ready') < 90 ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  ai:
    profiles: [mock]
    image: moodlehq/moodle-php-apache@sha256:1db7b6ed013fcb5268095b5e28c410ba9117d38d9b6a324c100c48fcbe69745e
    entrypoint: [php, -S, '0.0.0.0:8080', /lab/mock-ai.php]
    command: []
    volumes:
      - ./mock-ai.php:/lab/mock-ai.php:ro
      - ./lesson-scenes.json:/lab/lesson-scenes.json:ro
volumes:
  pgdata:
  moodledata:
  certificates:
