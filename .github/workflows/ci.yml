name: Moodle integration
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  schedule:
    - cron: '23 0 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to verify and resume publishing (optional)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  tooling:
    name: PHP tooling and native browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: moodle-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # Public checkout through git, so CI itself needs no JavaScript actions.
      - name: Fetch the exact event revision
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Resolve the shared immutable PHP image
        run: echo "PHP_IMAGE=$(php scripts/runtime-images.php php)" >> "$GITHUB_ENV"
      - name: Verify repository operations policies
        run: docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/operations.php
      - name: Prepare locked Moodle coding tools
        run: |
          mkdir -p "$RUNNER_TEMP/videoq-moodle-codecheck"
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint php -v "$PWD:/src:ro" -v "$RUNNER_TEMP/videoq-moodle-codecheck:/tools" "$PHP_IMAGE" /src/scripts/check-moodle-code.php prepare /tools
      - name: Check official Moodle coding standard offline
        run: docker run --rm --network none --user "$(id -u):$(id -g)" --entrypoint php -v "$PWD:/src:ro" -v "$RUNNER_TEMP/videoq-moodle-codecheck:/tools" "$PHP_IMAGE" /src/scripts/check-moodle-code.php scan /tools
      - name: Verify installer contract offline
        run: docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/packages.php
      - name: Verify private signing-key helper offline
        run: docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/tool-keys.php
      - name: Check PHP syntax
        run: docker run --rm --network none --entrypoint sh -v "$PWD:/src:ro" -w /src "$PHP_IMAGE" -c 'find plugins scripts tests lab -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: PHP unit and dependency contracts
        run: |
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/lab.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/browser-connection.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/account-management.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/course-entry.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/source-management.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/transcription-language.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/youtube-source.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/privacy-requests.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/token-endpoint.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/native-api.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/native-context.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/codecheck.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/translations.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/dependencies.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/release.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/live-lock.php
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/matrix.php
      - name: Verify local root-source publication offline
        run: php tests/source-exports.php
      - name: Check Privacy API against pinned Moodle classes
        env:
          MOODLE_REVISION: a682566412e1d429b95ac8ef4351a518f61b94c5
        run: |
          fixture="$RUNNER_TEMP/videoq-moodle-privacy"
          git init "$fixture"
          git -C "$fixture" sparse-checkout init --no-cone
          git -C "$fixture" sparse-checkout set /public/privacy/classes/ /public/lib/setuplib.php /public/lib/weblib.php /public/lib/mustache/ /public/lib/templates/ /public/message/templates/
          git -C "$fixture" fetch --depth=1 --filter=blob:none https://github.com/moodle/moodle.git "$MOODLE_REVISION"
          git -C "$fixture" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture" rev-parse HEAD)" = "$MOODLE_REVISION"
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" -v "$fixture:/moodle:ro" "$PHP_IMAGE" /src/tests/privacy.php /moodle
      - name: Download paired native browser executables
        run: php scripts/native-browser.php /tmp/videoq-native-browser >> "$GITHUB_ENV"
      - name: Compile browser assets through PHP WebDriver
        run: php lab/check-browser.php
      - name: Exercise Moodle-rendered native learning panels
        run: php lab/check-native-learning.php "$RUNNER_TEMP/videoq-moodle-privacy"
      - name: Verify native File and YouTube player contracts
        run: php lab/check-youtube-player.php
      - name: Check Moodle Compose configuration
        run: |
          docker compose --env-file lab/compose.env.example -f lab/compose.yaml --profile mock config --quiet
          docker compose --env-file lab/compose.env.example -f lab/compose.restore.yaml config --quiet
          docker compose --env-file lab/compose.env.example -f lab/compose.yaml --profile mock config --format json | php tests/compose-images.php lab
          docker compose --env-file lab/compose.env.example -f lab/compose.restore.yaml config --format json | php tests/compose-images.php restore
      - name: Build installers
        run: |
          mkdir -p dist
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" -v "$PWD/dist:/output" "$PHP_IMAGE" /src/scripts/package-plugins.php /output
      - name: Build English-only submission archives and AMOS import
        run: |
          mkdir -p dist/marketplace dist/translations
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" -v "$PWD/dist/marketplace:/output" "$PHP_IMAGE" /src/scripts/package-plugins.php /output --marketplace
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" -v "$PWD/dist/translations:/output" "$PHP_IMAGE" /src/scripts/package-translations.php /output
  database:
    name: Installed Moodle database (${{ matrix.database }})
    needs: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [pg, mysql]
    concurrency:
      group: moodle-database-${{ github.event.pull_request.number || github.ref }}-${{ matrix.database }}
      cancel-in-progress: true
    steps:
      - name: Fetch the exact event revision
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Run isolated installed-Moodle lifecycle
        env:
          MATRIX_DATABASE: ${{ matrix.database }}
        run: php lab/check-marketplace-matrix.php "$MATRIX_DATABASE" "$RUNNER_TEMP/videoq-marketplace-matrix"
      - name: Show sanitized lifecycle evidence
        run: cat "$RUNNER_TEMP/videoq-marketplace-matrix/summary.json"
  verify:
    # Preserve the existing required-check context while including both DB results.
    name: PHP-only tooling and native browser checks
    if: always()
    needs: [tooling, database]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require tooling and both database lifecycles
        env:
          TOOLING_RESULT: ${{ needs.tooling.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$TOOLING_RESULT" = success
          test "$DATABASE_RESULT" = success
  release:
    name: Publish or verify tagged ZIPs
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: moodle-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Fetch publisher and exact tagged source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          cp scripts/publish-release.php /tmp/videoq-publish-release.php
          cp scripts/runtime-images.php /tmp/videoq-runtime-images.php
          cp lab/images/compose.yaml /tmp/videoq-runtime-images.yaml
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          git checkout --detach FETCH_HEAD
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
      - name: Resolve the tagged immutable PHP image
        run: |
          manifest=lab/images/compose.yaml
          if [ ! -f "$manifest" ]; then manifest=/tmp/videoq-runtime-images.yaml; fi
          echo "PHP_IMAGE=$(php /tmp/videoq-runtime-images.php php "$manifest")" >> "$GITHUB_ENV"
      - name: Verify and build tagged installers offline
        run: |
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" "$PHP_IMAGE" /src/tests/packages.php
          mkdir -p dist
          docker run --rm --network none --entrypoint php -v "$PWD:/src:ro" -v "$PWD/dist:/output" "$PHP_IMAGE" /src/scripts/package-plugins.php /output
      - name: Reconcile release and verify immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: php /tmp/videoq-publish-release.php "$RELEASE_TAG" dist
